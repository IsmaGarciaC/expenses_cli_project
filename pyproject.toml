[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "expenses_tracker_cli"
version = "0.1.0"
description = "CLI para registrar y consultar gastos personales"
requires-python = ">=3.10"


[project.scripts]
expenses = "expenses_cli.cli:main"


[tool.setuptools.packages.find]
where = ["src]
